{tab:"start",heading:"最重要的 5 件事",steps:true,items:[
["角色幾乎不會真的永久消失","只有「寺院復活失敗→變灰→再失敗」才會永久失去。メンタル（Fortitude）回到 50 以上再去寺院復活就安全。"],
["主角陣亡選「再起」，不要選「死を受け入れる」","再起最多 3 次、會隨時間回復，回到那場戰鬥之前；接受死亡會被送回存檔點，部分進度要重跑。"],
["不要急著克己、繼承、引退角色","素材角色會消失且不可逆。巴哈老手建議先打完前兩章再決定，不確定就先上巴哈或 Discord 問。"],
["前期打 2–3 場就回城","經驗要在旅館（宿屋）住宿才會升級。先找到哈肯（ハーケン）再往深處走。"],
["隊伍一定要有僧侶，身上帶 3–5 瓶回復藥","僧侶是續航命脈；回復藥留到 HP 變紅再用。"]]},
{tab:"start",heading:"死亡、メンタル與復活",items:[
["メンタル（Fortitude／精神值）","上限 80/90/100，每 6 分鐘回 1，死亡中也會回。死亡 −30、寶箱陷阱 −4~−5、解除失敗 −1、主角再起時全員 −5。主角沒有顯示メンタル，可讓主角開寶箱分擔（Gamerch 註：內部可能仍有影響）。"],
["戰鬥中復活（逆転の右手／Right Hand of Reversal）","沒有永久死亡風險，但每次陣亡事件只能救一人；點失敗主角會掉血或麻痺。"],
["救不了就讓主角陣亡再起","隊友在同一場戰鬥先死、主角接著陣亡並再起，隊友會一起復活（Gamerch 情況 A）。被奇襲或打不贏時特別好用。"],
["寺院復活","メンタル 50 以下有失敗風險。可捐寶石（貴石）保證復活，每天最多 3 次（Gamerch）。最省的方法是把角色放板凳等メンタル回滿。"],
["復活點擊時機","圓圈一出現就點；30fps 最穩，60fps 約晚 0.3–0.5 秒。メンタル越低圓圈越小（Community Guide）。"]]},
{tab:"start",heading:"探索、安全區與鑰匙",items:[
["哈肯（ハーケン／Harken）","可回城、在哈肯之間傳送；大哈肯能給隊伍強力加護。等級低時不要硬衝去找下一個。"],
["命の井戸（生命之井）","每個遊戲日 1 次全回 HP/MP/SP，也能開營地和隊友對話。日期在旅館住宿後推進。"],
["ハーケンの鉤（Hook of Harken）","緊急撤退道具，第二章水路被水流沖走時救命，必帶。"],
["鑰匙與上鎖門","第一章 B2F 用「奈落の鍵」開的房間有戰士、盜賊、僧侶、法師的遺骸。水路紅色門要接依頼「双頭の蛇」拿到合鍵才開。"],
["陷阱與寶箱","毒床、陷阱床會扣血和メンタル。寶箱交給盜賊（罠解除看器用、罠發現看知恵）。派遣隊不放盜賊容易炸箱。"],
["Cursed Wheel（カースドホイール）","第一章二周目解鎖，可回到劇情節點重做分支。各章的好結局、真結局都需要多輪迴。"]]},
{tab:"start",heading:"戰鬥基本",items:[
["前排與後排","前排近戰武器 100% 發揮但較常被打；後排近戰傷害與命中下降、閃避上升。後排用弓、槍、苦無。主角放後排拿弓較安全。"],
["隙（Opening）","防禦敵人物理攻擊→敵人頭上出現「！」→下一擊必中，傷害依敵人 HP 比例。範圍攻擊要被打的那排多人一起防禦。出隙後的下一次攻擊防禦不會再出隙。"],
["睡眠 KATINO（カティノ）","打睡著的敵人必定爆擊，物理魔法都算。兩名法師時一人睡、一人放列魔法最省 MP。"],
["屬性相剋","火剋風、風剋土、土剋水、水剋火；光暗互剋。打弱點 +30%，角色本身屬性與武器或呪文同屬再疊到 +60%。屬性防具每件減該屬性傷害 15%，最多 3 件 45%。"],
["Buff 上限 3 個","超過會被覆蓋，看不出效果時先檢查。"],
["逃跑","每位隊員的回合都能嘗試，一回合最多 6 次機會；賞金首戰 100% 可逃。"],
["主角性格（Alignment）","戰前選「給治療道具」+2 善、「無視」+1 善；「伏擊」+2 惡、「攻擊」「哀求」+1 惡。隊友性格固定。"]]},
{tab:"party",heading:"屬性點（BP）分配原則",items:[
["速度在所有職業都不虧","影響行動順序、閃避、罠回避。不確定最終職業時點速度最保險（Gamerch）。"],
["速度排序","建議維持 法師 > 戰士 = 僧侶。巴哈：法師速度約 65 才能先手第二章船內 2 層的魅魔。"],
["騎士不要全點速度","騎士の守り最佳狀態是全隊比敵人快、騎士在隊上最慢，這樣減傷正好蓋到敵人回合。"],
["BP 只能重洗一次","BP 5–10 點（10 點僅 1%）。點錯不能重洗，只有同一化時能重洗一次。總克己超過 10 後每升一級 +1 BP。"]]},
{tab:"party",heading:"推薦隊伍組成",items:[
["通用（Gamerch）","前：戰士／主角／戰士（或騎士）。後：盜賊／法師／僧侶。"],
["雙法師（前兩章清怪快）","前：戰士（騎士）／主角／盜賊。後：法師／法師／僧侶。"],
["常駐傳說最強（Gamerch）","前：主角（中立）／拉納維爾／雅蓓妮斯。後：愛麗絲／葉卡／黛波拉。主角中立時與黛波拉換位仍吃得到愛麗絲、拉納維爾的排加成。"],
["巴哈第一章實戰（一周目 Lv20、二周目 Lv30）","前：拉納維爾／主角（戰士）／雅蓓妮斯。後：愛麗絲／葉卡／黛波拉。"],
["高難度王戰（Gamerch）","前：盜賊（騎士）／戰士／戰士（武士）。後：主角（戰士或騎士，持槍或弓）／僧侶（治癒師）／法師。全員找機會用渾身の一撃。"],
["對付會強化自己的敵人","前：盜賊（戰士）／忍者／戰士。後：主角（騎士）／僧侶／法師。忍者用「霧消」消敵方 buff，來不及就靠騎士の守り硬吃。"],
["低稀有善隊（Gamerch）","前：芭芭拉（バルバラ）／艾莉賽（エリゼ）或克洛艾（クロエ）。後：瑪麗安娜（マリアンヌ）／芙爾特（フルート）或亞莎（アーシャ）／讓（ジャン）。省 SP、MP，適合長期戰。"],
["排加成怎麼放","愛麗絲：同排全為惡或中立時增傷。拉納維爾：同排全為善或中立時增傷。所以主角保持中立最有彈性。"],
["轉職組合評價（AppMedia）","◎ 僧侶×法師、戰士×騎士、戰士×盜賊；○ 戰士×僧侶、忍者。"],
["角色配比（Community Guide）","主輸出 1–2、副輸出 2–3、輔助 2–3、治療 1–2，靠「一人兼多職」壓進 6 人。"]]},
{tab:"gear",heading:"強化與鍛造流程",steps:true,items:[
["前期 +1~+4 先停","很便宜、不虧；+5 起需要鐵礦石、費用暴增（Gamerch）。卡關時防具各 +1 也有感。"],
["前排優先","武器與前排防具先強化，後排之後再補。"],
["+5/+10/+15/+20 解鎖追加護","每個節點解鎖或強化第 1–4 條追加護（Blessing），裝備顏色白→綠→藍→紫→紅。"],
["超過 +5 要合一化（合一化／Unify）","吃同名裝備提高限界強度。2026/3/27 更新起改為點數制，初始裝備一件 1 點，26 點吃滿。"],
["變造在前、精鍊在後","變造（Alteration）要在該欄位的強化節點之前做，否則強化加成會被洗掉；精鍊（Refine）強化後再做也會保留（1.12.1 起）。"],
["抽出（Extract）","每條追加護約 20% 機率產出石頭，石頭星數看裝備品質★，不看數值。"]]},
{tab:"gear",heading:"武器與裝備選擇",items:[
["雙手武器現在是主流","2025/9/15 攻擊公式調整後雙手武變強。巴哈 2026/6 新手文：直上雙手武，二章水路 1–3 丁目刷鋼階雙手，三章刷冥鋼（最好是破魔）雙手，冥鋼破魔雙手（含弓）到四章都能用。舊日文文章寫「單手＋盾較好」的屬於改版前。"],
["不死系要退魔武器","第一章 B6F 後出現不死系，沒有不死特效很難打。B7F 以後「冥刻」字樣的ガラクタ可換到退魔武器。"],
["屬性武器","水路多數敵人弱土（去土の魔窟刷）；要塞 1–3 區敵人屬土，帶風屬。"],
["要塞推薦配裝（Gamerch）","武器鋼級 +20、前排鐵或鋼級防具 +15 以上、前排閃避 130–140。巴哈補充：改版後 Lv50–54、閃避 80–100、冥鋼武器 +10~+15 也能過要塞三周目。"],
["特典裝備","限定池附的特典裝備初始可強化到 +10，但品質隨機，Community Guide 認為通常不值得特別追。"],
["自動裝備小心","自動裝備優先稀有度，可能讓攻擊力下降，強化過的請手動裝。"]]},
{tab:"gear",heading:"技能重點",items:[

["騎士の守り（Knight's Defense）","騎士 Lv51 學會，1 回合內全隊減傷約 40%（技能 Lv1），是硬吃全體大招的關鍵。"],
["MONTINO（封魔）","對大多數會施法的敵人成功率高，效果持續整場。"],
["KANTIOS（混亂）","法師 Lv40 學會。睡眠無效時用來打斷大招，例如蠍女蓄力後。"],
["MASOLOTU＋DILTO","提升我方閃避＋降低敵方命中，雜魚幾乎打不到你；對高命中或施法者無效。"],
["遲緩攻擊（Delay Attack）","盜賊技能，推遲敵人回合；王第一次通常吃得到，之後成功率大降。"],
["驅散 buff","忍者「霧消」、法師「呪滅の風」可消除敵人的強化。"],
["聖堂加護","減傷技能書，第二章教皇線大異形獎勵，每月可再拿一次；巴哈建議二章先走教皇線。"]]},
{tab:"gear",heading:"克己、繼承、同一化、轉職",items:[
["克己（Discipline）","重複角色疊加強化。克己到 9 所需同名角色：傳說 15 隻、一般 35 隻、無名 70 隻（Gamerch）。ドッペル水銀 1 個 = 25 克己點。"],
["繼承（Inheritance）","把角色的繼承技能傳給別人（含主角），沒有已知的繼承數上限；用研鑽の宝典升技能等級。"],
["同一化（Merging）","同角色不同風格合併：可重洗 BP 一次，メンタル取較高者。"],
["轉職保留技能","已學技能轉職後保留（職業專用技除外，例如戰士的渾身の一撃、騎士の守り）。轉去僧侶學解狀態再轉回，是常見往返玩法。"],
["主角轉職","主角可轉遊俠、治癒師以外的所有職業，並用心器の淵自訂能力與屬性（AppMedia）。"],
["轉職書","寶石商每週隨機 4 本，每本 400 寶石（其中 2 本限紫寶石）；看到需要的再買。"]]},
{tab:"boss",heading:"各章 Boss 打法細節",items:[
["第一章 蠍女（サソリ女／Scorpion Lady）","腐蝕液降前排物防、甩尾暈一排、鉗擊會換位→立刻把隊形調回。Build Up 蓄力一回合後重擊被瞄準者與其後方，兩人都防禦。用風屬（そよ風の剣、FERU）。"],
["第一章 大異形 赫爾穆特（暫譯；ヘルムート／Helmut）","弱風。把ディガーピッケル（Digging Mattock）給非主角的前排清他造的瓦礫，逆轉之右手也能清。MASOLOTU、MAKALTU 自保；BATILGREF、BALAFEOS、DILTO、MORLIS 削弱他；法師維持 Mental Unity 用列魔法清小怪。"],
["第二章 闘技場","第一次挑戰 1、3（王女線、提督線）、4、5 回合時只派主角，省寺院復活費。多數回合是「先輸→和 Rickett 對話→做依頼→再打就贏」。"],
["第二章 大異形 怨妒者梅爾吉娜／奧克多納拉斯（メルジーナ／オクトナルス）","都弱土（葉卡 ERLIK、MAERLIK、土の魔窟武器）。MASOLOTU＋CORTU 減傷、KINAPIC 防睡、被清掉的 buff 立刻補。逆轉之右手用在神像排水。奧克多納拉斯（Octonarus）需先讀完 7 座人魚像，並得先打兩次梅爾吉娜（Melgina），先爆發她。"],
["第三章 要塞道中","巴哈：3F 人馬封魔（MONTINO）成功後幾乎無壓力；7F「吾等榮光」帶有抗惑香的治癒師，法師上減速 debuff 更穩。"],
["第三章 大異形 守門人（門番／Gatekeeper）","沒有屬性弱點、防禦高→用穿防技。建議 2–3 戰士＋僧侶＋騎士＋忍者。P1：先用渾身の一撃拆兩隻觸手，騎士最後出手放騎士の守り，忍者驅散 Wrath。P2：本體倒地時對魔像用逆轉之右手，弱點只有遠程（不含槍）與盜賊不意打ち打得到，這階段慢慢打留資源。HP 隨腐蝕程度變動。"],
["第三章 結局與腐蝕","共 4 個結局，前兩個壞結局必經；要達成 Blackmail（好結局）才能進第四章。被腐蝕哨兵發現越多次，Boss 越強。"],
["第四章 凍結機制","吹雪區每回合先上 10 層凍え再 −2，水屬攻擊 −3，歸零即凍結（速度、命中、閃避大降，雙手武攻擊可擊碎造成大傷）。火屬攻擊、溫泉、營地、碎冰鎚可解除。"],
["第四章 大腳怪／雪狼首領（ビッグフット／スノーウルフリーダー）","大腳怪（Bigfoot）：火會激怒它；先殺本體，剩下的小大腳怪會大幅弱化。雪狼首領：它被凍結且場上 6 隻以上狼時會放全體 Glacial Storm，盡快打破它的凍結。"],
["第四章 大異形 戈弗羅（ゴドフロウ／Godefroi，真結局戰）","先拆冰柱（約 1000 HP、弱火，LA- 系呪文好用）；幽靈小孩物理免疫，要 3 回合內用魔法清掉；第一動作必放 Maporfic，盡快驅散否則物理 0 傷。不要一次灌太多傷害以免觸發反擊。建議 2 名補師、2 名群攻法師、騎士の守り。"],
["第四章 白い虚影（Nullshadow）","不可擊殺，碰到就逃；離開吹雪區就會消失。"]]},
{tab:"res",heading:"每日／每週／每月例行",items:[
["每日","日次ミッション（20 寶石＋40 公會點）、寶石商「日替わりの冒険役立ち品一式」100G 換 10 寶石（很多人到後期才發現）、日次依頼（金幣、ガラクタ、經驗時計）、派遣、命の井戸。"],
["每週","週次ミッション（200 寶石＋600 公會點）、官方網店免費 50 寶石、週次依頼的認識票、寶石商轉職書。巴哈：每週任務台灣時間週日 23:00 重置。"],
["隔週","坩堝の霊廟收一般冒險者遺骸，巴哈：隔週六 23:00 重置；Lv20 前或 Lv40 後比較好打，Lv30 剛好最難。"],
["每月","各章大異形討伐獎勵可再拿（聖堂加護等，建議從最新章往回拿）、冒險者遺骸約一個月重生、賞金首討伐勳章兌換、公會點換寶石（1000 點換 250，每月 2 次）與傳說遺骸（8000 點，每月 1 次）。"]]},
{tab:"res",heading:"抽卡規則與寶石用法",items:[
["常駐機率","無名 50%、一般 45%、傳說 5%。"],
["限定池","限定傳說約 2%；每抽送 1 個代幣，100 個可直接換本人，保底成本 18,200 寶石。沒有傳統保底，代幣不跨池，連復刻也不繼承。"],
["免費玩家節奏","只算固定來源，每月約 2,300 寶石，約 5.5 個月可保底一隻限定傳說；加上活動與補償會更快，但不可能全抽。"],
["寶石優先用途","限定傳說遺骸、轉職書。不建議買一般「冒険者の遺骸」。紫寶石（エリンの貴石）只能課金，附特典裝備的池通常不划算（例外如三連擊的カシナートの剣）。"],
["開局","第一次進奈落後立刻回城，街上的骨拾い賣 100G 的骨，可指定 6 名常駐傳說之一：哲魯夫、亞當、愛麗絲、黛波拉、葉卡、拉納維爾。各站共識首選愛麗絲。官方網店另有一次性 800 寶石。"],
["常駐池分 Type I／II（2026/1/15 起）","Type I：拉納維爾、愛麗絲、亞當、葉卡、哲魯夫、黛波拉。Type II：流浪公主、Gerard、雅蓓妮斯、紅鬍子、凜音、Savia。"],
["低 Tier 不等於沒用","巴哈提醒：亞曆克斯（アレックス）的騎士の心得、歐拉莉亞（エウラリア）的不屈の闘志、亞當（アダム）的真理の叡智都是珍貴的減傷繼承來源。"]]},
{tab:"faq",heading:"常見卡關問題",items:[
["等級卡在 20／30／40 不能升？","要考等級試驗：鉛 Lv20、青銅 30、鐵 40、鋼 50、銅 60。每人需要現等級的認識票，且要參加考試拿到印記。認識票來自引退角色與週次依頼；用寶石買印記不划算。超過上限的經驗會先存著。"],
["第一章 B6F 傳送點選哪個？","看各傳送房附近的屍體提示：第一具叫你忽略某房、第二具提到前方的光（想北邊）、第三具說跟著消逝的光（想夕陽）。"],
["B6F 雕像謎題？","面對傳送點時每座雕像對應一名隊員，只修復符合提示的。「遍在的種族」= 人類（含主角）、「賢明長壽」= 精靈、「勇敢戰士」= 戰士、「靈巧」= 盜賊、「最弱」= 力量最低、「賢者」= 知恵最高。答案也可能是一座都不修。"],
["B7F 毒通道每次都要走？","到 B8F 逆轉 4 個石堆，其中 2 個會開出繞過毒區的捷徑。"],
["房間淹水快溺死？","先分別嘗試從房間左上、右上出口和來時的路離開，再去啟動雕像排水；可以只帶主角進去。完成一次就不用再做。"],
["地圖跟攻略長得不一樣？","部分地塊會旋轉互換，主要路線和事件位置相同。"],
["被困在迷宮出不去？","回標題畫面→齒輪→強制復旧，回到上次存檔點，一天限一次。"],
["水路裡不能放魔法？","水中無法詠唱，但卷軸可用；「落石の巻物」打サハギン弱點。凜音的技能可在水中代替呪文。記得帶ハーケンの鉤。"],
["第三章難度暴增怎麼辦？","回水路刷裝、衝到 Lv50 左右、堆閃避。很多人會先卡在 1–3 區，屬正常。"],
["第二章先走哪條線？","巴哈建議先走教皇線拿聖堂加護技能書，再走提督線、王女線；每條線的進度彼此獨立。"],
["BP 點錯能重洗嗎？","不行，只有同一化時能重洗一次。"],
["迷宮裡 MP、SP 怎麼回？","命の井戸每遊戲日一次，或回城住旅館。"],
["主角名字能改嗎？","用 Cursed Wheel 回到最開始向露露娜蒂（ルルナーデ）報名的地方即可改；冒險者用寶石改名。"],
["每天幾點換日？","日版 00:00 JST，也就是台灣 23:00。"]]}
];
